<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bad7f2"/>
      <stop offset="100%" stop-color="#f2bac9"/>
    </linearGradient>
  </defs>

  <rect width="680" height="320" fill="url(#bg)"/>

  <!-- Bascula (base) -->
  <rect x="255" y="210" width="170" height="26" rx="10" fill="#1e3a5f"/>
  <rect x="255" y="182" width="170" height="34" rx="14" fill="#eef4fa"/>

  <!-- Dial de la bascula -->
  <circle cx="340" cy="199" r="26" fill="#ffffff" stroke="#1e3a5f" stroke-width="4"/>
  <circle cx="340" cy="199" r="3" fill="#1e3a5f"/>
  <line x1="340" y1="199" x2="352" y2="188" stroke="#1e3a5f" stroke-width="3" stroke-linecap="round"/>

  <!-- Marcas del dial -->
  <g stroke="#1e3a5f" stroke-width="2" opacity="0.5">
    <line x1="340" y1="177" x2="340" y2="182"/>
    <line x1="318" y1="199" x2="323" y2="199"/>
    <line x1="362" y1="199" x2="357" y2="199"/>
  </g>

  <!-- Huella sobre la bascula, representando al perro pesandose -->
  <g fill="#f2bac9">
    <ellipse cx="340" cy="150" rx="13" ry="17"/>
    <ellipse cx="368" cy="140" rx="10" ry="13"/>
    <ellipse cx="312" cy="140" rx="10" ry="13"/>
    <ellipse cx="342" cy="118" rx="20" ry="17"/>
  </g>

  <!-- Flecha descendente sutil, indicando perdida de peso -->
  <g stroke="#1e3a5f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <path d="M 480 110 L 480 165"/>
    <path d="M 466 151 L 480 165 L 494 151"/>
  </g>

  <!-- Huellas decorativas en las esquinas -->
  <g fill="#1e3a5f" opacity="0.18">
    <ellipse cx="120" cy="80" rx="10" ry="13"/>
    <ellipse cx="145" cy="72" rx="8" ry="11"/>
    <ellipse cx="100" cy="68" rx="8" ry="11"/>
    <ellipse cx="122" cy="52" rx="16" ry="14"/>
  </g>

  <g fill="#1e3a5f" opacity="0.14">
    <ellipse cx="580" cy="260" rx="10" ry="13"/>
    <ellipse cx="605" cy="252" rx="8" ry="11"/>
    <ellipse cx="560" cy="248" rx="8" ry="11"/>
    <ellipse cx="582" cy="232" rx="16" ry="14"/>
  </g>
</svg>
